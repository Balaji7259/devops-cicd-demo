name: SSM connectivity check

# Manual only. Proves that a GitHub runner can reach the instance through
# Systems Manager, using exactly the credentials and permissions the deploy job
# will use - without touching the deploy job, the container, or port 22.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-01c13546bb8b4b707

jobs:
  probe:
    name: Send a read-only command
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Which identity is this?
        run: aws sts get-caller-identity --query Arn --output text

      - name: Send a read-only command and wait for it
        shell: bash
        run: |
          set -euo pipefail

          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --comment "pipeline probe: read-only" \
            --query "Command.CommandId" \
            --output text)

          echo "command id: ${CMD_ID}"

          STATUS="Pending"
          for attempt in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "attempt ${attempt}: ${STATUS}"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 3
          done

          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "[Status,ResponseCode,StandardOutputContent,StandardErrorContent]" \
            --output json

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::SSM command ended in ${STATUS}"
            exit 1
          fi

          echo "SSM works from a runner - the deploy job can be migrated"
