name: Build, Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-cicd-demo
  CONTAINER_NAME: devops-demo

jobs:
  # ---------------------------------------------------------------- gate 1
  # Cheap static checks. Fails in ~10s on a missing file or malformed HTML,
  # before any cloud credential is spent or any image is built.
  test:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          set -euo pipefail
          for f in Dockerfile site/index.html site/about.html site/style.css site/assets/logo.svg; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              exit 1
            fi
            echo "present: $f"
          done

      - name: Validate HTML structure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from html.parser import HTMLParser

          VOID = {"area", "base", "br", "col", "embed", "hr", "img",
                  "input", "link", "meta", "source", "track", "wbr"}

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []

              def handle_startendtag(self, tag, attrs):
                  # <meta />, <link /> and friends arrive here, not as start+end.
                  pass

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append(tag)

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.errors.append(f"stray </{tag}>")
                  elif self.stack[-1] != tag:
                      self.errors.append(f"</{tag}> closes <{self.stack[-1]}>")
                      self.stack.pop()
                  else:
                      self.stack.pop()

          failed = False
          for path in ("site/index.html", "site/about.html"):
              parser = Checker()
              parser.feed(open(path, encoding="utf-8").read())
              parser.close()
              if parser.errors or parser.stack:
                  failed = True
                  print(f"::error file={path}::unbalanced markup: {parser.errors or parser.stack}")
              else:
                  print(f"well-formed: {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Assert health endpoint marker is shipped
        run: |
          set -euo pipefail
          # The container's /healthz is served from this file; if the marker
          # disappears, the deploy job's health check would fail anyway.
          grep -q "healthz" Dockerfile || { echo "::error::Dockerfile no longer defines /healthz"; exit 1; }
          echo "health endpoint contract intact"

  # ---------------------------------------------------------------- gate 2
  build-and-push:
    name: Build, smoke test and push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Built under a local name first. Nothing touches AWS until the image has
      # proven it can serve traffic, so a broken build never reaches the registry.
      - name: Build image
        id: build
        run: |
          set -euo pipefail
          LOCAL_TAG="devops-cicd-demo:${GITHUB_SHA}"
          echo "Building ${LOCAL_TAG}"
          docker build --tag "${LOCAL_TAG}" .
          echo "local_tag=${LOCAL_TAG}" >> "${GITHUB_OUTPUT}"

      # Gate 2: the built artefact is actually started and queried before it is
      # allowed anywhere near ECR. Every path the site depends on is fetched.
      - name: Smoke test the image
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 "${LOCAL_TAG}"
          trap 'docker logs smoke --tail 30 || true; docker rm -f smoke || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          check() {
            local path="$1" expect="${2:-200}"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            if [ "${code}" != "${expect}" ]; then
              echo "::error::GET ${path} returned ${code}, expected ${expect}"
              exit 1
            fi
            echo "GET ${path} -> ${code}"
          }

          check /healthz
          check /
          check /about.html
          check /style.css
          check /assets/logo.svg

          body=$(curl -fsS http://localhost:8080/healthz)
          [ "${body}" = "ok" ] || { echo "::error::/healthz body was '${body}', expected 'ok'"; exit 1; }
          curl -fsS http://localhost:8080/ | grep -q '<title>' || { echo "::error::no <title> in served HTML"; exit 1; }
          echo "smoke test passed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        id: push
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Retag through the registry host ECR reported, so the URI used for
          # the push is identical to the one the deploy job will pull.
          PUSH_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "${LOCAL_TAG}" "${PUSH_URI}"
          docker push "${PUSH_URI}"
          echo "image_uri=${PUSH_URI}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH access
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Pull and replace the container
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "ubuntu@${EC2_HOST}" \
              "IMAGE_URI='${IMAGE_URI}' CONTAINER='${CONTAINER_NAME}' REGION='${AWS_REGION}' bash -s" <<'REMOTE'
          set -euo pipefail

          REGISTRY="${IMAGE_URI%%/*}"
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE_URI"

          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" -p 80:80 --restart unless-stopped "$IMAGE_URI"

          for attempt in $(seq 1 10); do
            if curl -fsS http://localhost/healthz; then
              echo
              echo "Deployment healthy on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed after 20s — last 50 log lines:" >&2
          docker logs "$CONTAINER" --tail 50 >&2 || true
          exit 1
          REMOTE

      # Gate 3: verify from outside the instance, over the public internet.
      # A local health check can pass while the security group blocks real users.
      - name: Verify public endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS "http://${EC2_HOST}/healthz" | grep -q '^ok$'; then
              echo "public /healthz OK"
              break
            fi
            [ "$i" -eq 10 ] && { echo "::error::public endpoint never became healthy"; exit 1; }
            sleep 3
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "http://${EC2_HOST}/")
          [ "$code" = "200" ] || { echo "::error::public root returned ${code}"; exit 1; }
          echo "public root 200"

      - name: Report deployed image
        if: success()
        run: echo "Deployed ${{ needs.build-and-push.outputs.image_uri }}"
