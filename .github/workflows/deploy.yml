name: Build, Test and Deploy

# A push to main builds and ships that commit.
# A manual run with image_tag redeploys an already-published image — the
# rollback path. Both paths pass through the same gates and the same deploy step.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy (commit SHA). Leave empty to build from main."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-cicd-demo
  CONTAINER_NAME: devops-demo
  # Not a secret: an instance id is an address, not a credential. The CI policy
  # is scoped to this ARN, so naming it here grants nothing by itself.
  EC2_INSTANCE_ID: i-01c13546bb8b4b707

jobs:
  # ---------------------------------------------------------------- gate 1
  # Cheap static checks. Fails in seconds on a missing file or broken markup,
  # before any credential is used. Skipped on a rollback: the source being
  # rolled back to was already validated when it was built.
  test:
    name: Static checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          set -euo pipefail
          for f in Dockerfile site/index.html site/about.html site/style.css \
                   site/assets/logo.svg scripts/smoke-test.sh \
                   scripts/deploy-remote.sh; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              exit 1
            fi
            echo "present: $f"
          done

      - name: Validate HTML structure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from html.parser import HTMLParser

          VOID = {"area", "base", "br", "col", "embed", "hr", "img",
                  "input", "link", "meta", "source", "track", "wbr"}

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errors = []

              def handle_startendtag(self, tag, attrs):
                  # <meta />, <link /> and friends arrive here, not as start+end.
                  pass

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append(tag)

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.errors.append(f"stray </{tag}>")
                  elif self.stack[-1] != tag:
                      self.errors.append(f"</{tag}> closes <{self.stack[-1]}>")
                      self.stack.pop()
                  else:
                      self.stack.pop()

          failed = False
          for path in ("site/index.html", "site/about.html"):
              parser = Checker()
              parser.feed(open(path, encoding="utf-8").read())
              parser.close()
              if parser.errors or parser.stack:
                  failed = True
                  print(f"::error file={path}::unbalanced markup: {parser.errors or parser.stack}")
              else:
                  print(f"well-formed: {path}")
          sys.exit(1 if failed else 0)
          PY

      - name: Assert health endpoint marker is shipped
        run: |
          set -euo pipefail
          grep -q "healthz" Dockerfile || { echo "::error::Dockerfile no longer defines /healthz"; exit 1; }
          echo "health endpoint contract intact"

  # ---------------------------------------------------------------- gate 2
  build-and-push:
    name: Build, smoke test and push
    needs: test
    if: always() && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_uri: ${{ steps.resolve.outputs.image_uri }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Built under a local name first. Nothing touches AWS until the image has
      # proven it can serve traffic, so a broken build never reaches the registry.
      - name: Build image
        if: github.event_name == 'push'
        id: build
        run: |
          set -euo pipefail
          LOCAL_TAG="devops-cicd-demo:${GITHUB_SHA}"
          echo "Building ${LOCAL_TAG}"
          docker build --tag "${LOCAL_TAG}" .
          echo "local_tag=${LOCAL_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test the built image
        if: github.event_name == 'push'
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
          SMOKE_PORT: "8080"
        run: bash scripts/smoke-test.sh "${LOCAL_TAG}" "${SMOKE_PORT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: github.event_name == 'push'
        env:
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Retag through the registry host ECR reported, so the URI used for
          # the push is identical to the one the deploy job will pull.
          PUSH_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "${LOCAL_TAG}" "${PUSH_URI}"
          docker push "${PUSH_URI}"
          echo "pushed ${PUSH_URI}"

      # ------------------------------------------------------ rollback path
      - name: Validate rollback tag
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # 7-40 hex characters. The short form is allowed because the earliest
          # images in this registry were tagged by hand with a short SHA.
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must be a commit SHA (7-40 hex chars), got '${TAG}'"
            exit 1
          fi
          echo "rollback target accepted: ${TAG}"

      - name: Verify rollback image still serves the site
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        env:
          TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SMOKE_PORT: "8080"
        run: |
          set -euo pipefail
          URI="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          docker pull "${URI}"
          bash scripts/smoke-test.sh "${URI}" "${SMOKE_PORT}"

      # One place decides which image the deploy job will use, so the deploy
      # step never has to know whether this run built something or rolled back.
      - name: Resolve deployed image
        id: resolve
        env:
          TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if [ -n "${TAG}" ]; then
            URI="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
            echo "Rollback: deploying existing image ${URI}"
          else
            URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
            echo "Deploying freshly built image ${URI}"
          fi
          echo "image_uri=${URI}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    # Not `success()`. A rollback run skips the `test` job, and a skipped job
    # anywhere in the ancestor chain makes success() false — which silently
    # skipped this entire job while the run still reported green. Depend on the
    # one job that actually matters.
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No SSH key, no port 22. The command travels through the SSM control
      # plane and runs as root on the instance, authenticated by the instance
      # role. The runner only needs ssm:SendCommand against one instance ARN.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check out deploy script
        uses: actions/checkout@v4

      # The remote logic lives in scripts/deploy-remote.sh so it can be linted,
      # reviewed and tested against the real server before the pipeline relies
      # on it. It rolls back to the previous image if the new one is unhealthy,
      # then still exits non-zero so the run goes red.
      - name: Pull, replace and roll back if unhealthy
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail

          # Build the SSM parameter file with Python. Passing a 4.5 KB base64
          # string as a shell-quoted CLI argument is the kind of thing that
          # works until it meets a character it does not like; a JSON file has
          # no quoting rules left to get wrong.
          python3 - <<'PY'
          import base64, json, os

          script = base64.b64encode(open("scripts/deploy-remote.sh", "rb").read()).decode()
          image = os.environ["IMAGE_URI"]
          container = os.environ["CONTAINER_NAME"]
          region = os.environ["AWS_REGION"]

          remote = (
              "echo '" + script + "' | base64 -d > /tmp/deploy-remote.sh"
              + " && IMAGE_URI='" + image + "'"
              + " CONTAINER='" + container + "'"
              + " REGION='" + region + "'"
              + " bash /tmp/deploy-remote.sh"
              + "; rc=$?; rm -f /tmp/deploy-remote.sh; exit $rc"
          )
          with open("/tmp/params.json", "w", encoding="utf-8") as fh:
              json.dump({"commands": [remote]}, fh)
          print("parameter file bytes:", os.path.getsize("/tmp/params.json"))
          PY

          # Keep the CLI's own error text. Without this the job shows only
          # "exit code 1" and the reason is thrown away.
          if ! SEND_OUT="$(aws ssm send-command \
                --document-name "AWS-RunShellScript" \
                --instance-ids "${EC2_INSTANCE_ID}" \
                --comment "deploy ${IMAGE_URI}" \
                --timeout-seconds 300 \
                --parameters file:///tmp/params.json \
                --query "Command.CommandId" --output text 2>&1)"; then
            echo "::error::ssm send-command was rejected"
            echo "${SEND_OUT}"
            exit 1
          fi

          CMD_ID="${SEND_OUT}"
          echo "SSM command id: ${CMD_ID}"

          STATUS="Pending"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo "Pending")"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 2
          done

          echo "----- remote stdout -----"
          aws ssm get-command-invocation --command-id "${CMD_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query StandardOutputContent --output text || true

          echo "----- remote stderr -----" >&2
          aws ssm get-command-invocation --command-id "${CMD_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query StandardErrorContent --output text >&2 || true

          CODE="$(aws ssm get-command-invocation --command-id "${CMD_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query ResponseCode --output text 2>/dev/null || echo "unknown")"
          echo "final status: ${STATUS}, exit code: ${CODE}"

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::deployment command ended in ${STATUS} (exit ${CODE})"
            exit 1
          fi

      # Gate 3: verify from outside the instance, over the public internet.
      # A local health check can pass while the security group blocks real users.
      - name: Verify public endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS "http://${EC2_HOST}/healthz" | grep -q '^ok$'; then
              echo "public /healthz OK"
              break
            fi
            [ "$i" -eq 10 ] && { echo "::error::public endpoint never became healthy"; exit 1; }
            sleep 3
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "http://${EC2_HOST}/")
          [ "$code" = "200" ] || { echo "::error::public root returned ${code}"; exit 1; }
          echo "public root 200"

      - name: Report deployed image
        if: success()
        run: echo "Deployed ${{ needs.build-and-push.outputs.image_uri }}"

  # ---------------------------------------------------------------- guard
  # GitHub reports a run as green when a job is skipped, not just when it
  # succeeds. That is how a rollback run once went green having deployed
  # nothing. This job converts "nothing happened" into a red run.
  guard:
    name: Deployment guard
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the deploy job actually ran
        if: needs.deploy.result != 'success'
        env:
          BUILD: ${{ needs.build-and-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          echo "::error::Deployment did not happen — build=${BUILD} deploy=${DEPLOY}"
          echo "A skipped or failed deploy is not a successful run, even if GitHub shows green."
          exit 1

      - name: Confirm
        if: needs.deploy.result == 'success'
        run: echo "Deployment verified for ${{ needs.build-and-push.outputs.image_uri }}"
