# Keeps the two things that go stale without anyone noticing:
#   - the actions used by the workflow (a pinned SHA or a major bump)
#   - the nginx base image, which is where most CVEs in this project would land
#
# Grouped and scheduled monthly: this project deploys on every push to main, so
# an update PR is also a deployment. Batching them keeps the noise low.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
